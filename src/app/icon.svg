<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de Fundo Profundo Apple Liquid -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141e2e"/>
      <stop offset="50%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Gradiente Neon Aethel (Ciano para Esmeralda) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gradiente do Raio Central -->
    <linearGradient id="boltGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a7f3d0"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filtro Glow Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Filtro Glow Externo Suave -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur2"/>
    </filter>
  </defs>

  <!-- Fundo Circular com Borda de Vidro Apple Liquid -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)"/>
  
  <!-- Borda de Vidro Especular -->
  <rect x="8" y="8" width="496" height="496" rx="132" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.35" fill="none"/>
  
  <!-- Anéis Orbitais de Infraestrutura -->
  <circle cx="256" cy="256" r="180" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="210" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Glow do Núcleo -->
  <circle cx="256" cy="250" r="110" fill="#34d399" fill-opacity="0.22" filter="url(#outerGlow)"/>

  <!-- Brasão do Raio Central (Aethel Lightning Symbol) -->
  <path d="M282 84 L170 262 L248 262 L220 428 L352 230 L270 230 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Reflexo Superior Especular de Vidro Apple -->
  <path d="M70 120 Q 256 50 442 120 Q 256 95 70 120 Z" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Ponto de Status 24/7 Ativo -->
  <circle cx="410" cy="102" r="22" fill="#10b981" filter="url(#glow)"/>
  <circle cx="410" cy="102" r="12" fill="#ffffff"/>
</svg>
